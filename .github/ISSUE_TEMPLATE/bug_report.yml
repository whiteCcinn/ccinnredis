name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** include passwords or connection strings with credentials.
        Security issues should be reported privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open key / tool …
        3. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: CcinnRedis version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: redis-version
    attributes:
      label: Redis server version and topology
      placeholder: "Redis 7.2.4 / Valkey 8.0 — standalone, replica, Sentinel, Cluster or proxy (twemproxy, Codis, Envoy…)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac type
      placeholder: "macOS 15.2, Apple silicon"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
